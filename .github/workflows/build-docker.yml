name: build-docker

on:
  push:
    paths-ignore:
      - '.github/workflows/cmake-test.yml'
      - '.github/workflows/docker-cleanup.yml'
    tags-ignore:
      - '**'
  workflow_dispatch:

env:
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1

jobs:
  # split this way so hopefully the cache is there between normal and minimal
  build-docker-image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # no point in more than base image supports
        # ignore 32-bit - 386, arm/v5, arm/v7
        # arm64 == arm64/v8
        platform: [amd64, arm64, ppc64le, riscv64, s390x]
    env:
      registry: 'ghcr.io'
      package-name: ${{ case( startsWith(github.ref, 'refs/tags/v') || contains('["main", "dev", "unstable"]', github.ref_name), 'firestarr', 'cache' ) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: true

      - name: Login to container registry
        id: login
        uses: docker/login-action@v4
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - uses: ./.github/actions/docker-build-image
        id: build-firestarr
        with:
          target: firestarr
          registry: ${{ env.registry }}
          package-name: ${{ env.package-name }}
          platform: ${{ matrix.platform }}

      - uses: ./.github/actions/docker-build-image
        id: build-firestarr-minimal
        with:
          target: firestarr-minimal
          registry: ${{ env.registry }}
          package-name: ${{ env.package-name }}
          platform: ${{ matrix.platform }}

      # HACK: don't build on tag push, but check if this revision is tagged
      # NOTE: requires pushing tag first and then branch
      - name: Check tags
        id: check
        run: |
          VERSION_TAG=$(git describe --tags --abbrev=0 --match "v*")
          VERSION_HASH=$(git log -n1 --pretty=%H ${VERSION_TAG})
          FULL_HASH=$(git rev-parse --verify HEAD)
          IS_TAGGED=false
          if [[ "${VERSION_HASH}" == ${FULL_HASH} ]]; then
            IS_TAGGED=true
          fi
          echo "is-tagged=${IS_TAGGED}" >> $GITHUB_OUTPUT

    outputs:
      package: ${{ steps.build-firestarr.outputs.package }}
      is-tagged: ${{ steps.build-firestarr.outputs.is-tagged }}

  merge-firestarr:
    needs: [build-docker-image]
    uses: ./.github/workflows/docker-merge-image.yml
    with:
      target: firestarr
      package: ${{ needs.build-docker-image.outputs.package }}
      flavor: |
        latest=${{ case ( startsWith(github.ref, 'refs/tags/v'), 'auto', 'false' ) }}
        prefix=
        suffix=
      tags: |
        type=ref,event=pr
        type=ref,prefix=,suffix=,event=branch
        type=ref,prefix=,suffix=-latest,event=branch
        type=semver,pattern={{version}},prefix=,suffix=,enable=${{ needs.build-docker-image.outputs.is-tagged }}
        type=semver,pattern={{major}}.{{minor}},prefix=,suffix=,enable=${{ needs.build-docker-image.outputs.is-tagged }}

  merge-firestarr-minimal:
    needs: [build-docker-image]
    uses: ./.github/workflows/docker-merge-image.yml
    with:
      target: firestarr-minimal
      package: ${{ needs.build-docker-image.outputs.package }}
      flavor: |
        latest=false
        prefix=
        suffix=-minimal
      tags: |
        type=ref,event=pr,prefix=,suffix=-minimal
        type=ref,prefix=,suffix=-minimal,event=branch
        type=ref,prefix=,suffix=-minimal-latest,event=branch
        type=semver,pattern={{version}},prefix=,suffix=-minimal,enable=${{ needs.build-docker-image.outputs.is-tagged }}
        type=semver,pattern={{major}}.{{minor}},prefix=,suffix=-minimal,enable=${{ needs.build-docker-image.outputs.is-tagged }}
        type=raw,value=minimal,prefix=,suffix=
        type=raw,value=minimal-latest,prefix=,suffix=
